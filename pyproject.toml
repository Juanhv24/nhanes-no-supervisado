[project]
name = "nhanes-no-supervisado"
version = "0.1.0"
description = "Técnicas de aprendizaje no supervisado aplicadas a NHANES"
readme = "README.md"
authors = [
    { name = "Juan Hernández Vargas", email = "juandanihv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
