[project]
name = "nhanes-no-supervisado"
version = "0.1.0"
description = "Técnicas de aprendizaje no supervisado aplicadas a NHANES"
readme = "README.md"
authors = [
    { name = "Juan Hernández Vargas", email = "juandanihv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
